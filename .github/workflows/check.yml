name: Godot checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.2-stable_linux.x86_64
      - name: Import
        run: /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Domain and integration tests
        run: /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/action_tests.gd
